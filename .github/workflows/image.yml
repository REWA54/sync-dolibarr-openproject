name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Garde-fou : aucune image ne sort d'un commit dont les tests ou le typage échouent.
  verifier:
    name: Lint, types et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest

  # Le serveur cible est en amd64 : une seule architecture suffit.
  batir:
    name: Bâtir et publier
    runs-on: ubuntu-24.04
    needs: [verifier]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Préparer le nom
        # ghcr.io refuse les majuscules dans un nom d'image.
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/sync-dolibarr-openproject" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=sync-dolibarr-openproject
            org.opencontainers.image.description=Synchronisation Dolibarr ↔ OpenProject (projets, tâches, temps)

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
