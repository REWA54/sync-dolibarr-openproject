# Analyse sémantique du code Python et des workflows (requêtes « security-extended »).
name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
      security-events: write # publier les résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        langage: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.langage }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.langage }}
