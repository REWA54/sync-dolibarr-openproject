# Intégration et livraison continues.
#
#   tests ─┐
#   sécurité du code ─┤
#   secrets ─┼─► image : construite, scannée, testée durcie ─► publiée, signée, attestée ─► version
#   fichiers de config ─┘
#
# Rien n'est publié tant qu'une seule vérification échoue. Les demandes de fusion et le passage
# hebdomadaire vérifient tout sans rien publier.
name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # Chaque lundi : de nouvelles failles sont publiées même quand le code ne bouge pas.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.18"
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Dépendances figées, vérifiées par empreinte
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          uv pip install --require-hashes -r requirements-dev.txt -r requirements-build.txt
          uv pip install --no-deps --no-build-isolation -e .
      - name: Lint et format
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Typage strict
        run: .venv/bin/mypy
      - name: Tests et couverture
        run: .venv/bin/pytest --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  securite-code:
    name: Sécurité du code et des dépendances
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Outils
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes -r requirements-dev.txt
      - name: Analyse statique (bandit)
        run: .venv/bin/bandit -c pyproject.toml -r src
      - name: Failles connues des dépendances (pip-audit)
        run: |
          for fichier in requirements.txt requirements-build.txt requirements-dev.txt; do
            echo "::group::$fichier"
            .venv/bin/pip-audit --strict --require-hashes --disable-pip --progress-spinner off -r "$fichier"
            echo "::endgroup::"
          done

  secrets:
    name: Recherche de secrets dans tout l'historique
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/depot:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /depot --redact --no-banner --verbose

  fichiers-config:
    name: Dockerfile, workflows et scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Python de l'image couvert par les tests
        # Une mise à jour de l'image de base (Dependabot) ne doit pas faire tourner le service sur
        # une version de Python que les tests n'ont jamais vue : l'ajouter d'abord à la matrice.
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
          grep -qE "^ +python: \[.*\"${version}\"" .github/workflows/ci.yml \
            || { echo "::error file=Dockerfile::l'image part de Python ${version}, absent de la matrice de tests de ci.yml"; exit 1; }
      - name: Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - name: Workflows (actionlint)
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Sécurité des workflows (zizmor)
        run: uvx zizmor@1.30.1 --offline --min-severity low .github/workflows
      - name: Scripts (shellcheck)
        run: >
          docker run --rm -v "$PWD:/mnt"
          koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          scripts/test-fumee.sh
      - name: Exemple de déploiement (docker compose)
        env:
          DOLOP_IMAGE: exemple
          DOLOP_DOLIBARR_API_KEY: exemple
          DOLOP_OPENPROJECT_API_KEY: exemple
          DOLOP_DONNEES: /tmp/dolop
          DOLOP_RESEAU: exemple
        run: docker compose -f compose.yaml config --quiet

  image:
    name: Image (construction, scan, test durci, publication)
    needs: [tests, securite-code, secrets, fichiers-config]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le code
      packages: write # publier sur ghcr.io
      id-token: write # signature sans clé (Sigstore) et attestation
      attestations: write # attestation de provenance
      security-events: write # résultats Trivy dans l'onglet Security
    env:
      # Publier seulement depuis la branche principale ou une étiquette de version, jamais depuis
      # une demande de fusion ni le passage hebdomadaire.
      PUBLIER: >-
        ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Étiquette de version = version du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          grep -qx "version = \"${ETIQUETTE#v}\"" pyproject.toml \
            || { echo "::error::l'étiquette ${ETIQUETTE} ne correspond pas à la version de pyproject.toml"; exit 1; }
          grep -q "^## \[${ETIQUETTE#v}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md n'a pas de section [${ETIQUETTE#v}]"; exit 1; }
      - name: Nom de l'image
        # ghcr.io refuse les majuscules dans un nom d'image.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sync-dolibarr-openproject" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire (sans publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dolop:ci

      - name: Failles de l'image (Trivy) — bloquant si un correctif existe
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 dolop:ci
      - name: Rapport Trivy complet pour l'onglet Security
        if: always()
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/sortie" "$TRIVY_IMAGE"
          image --quiet --format sarif --output /sortie/trivy.sarif dolop:ci
      - name: Envoyer le rapport Trivy
        if: always() && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Test de fumée, conteneur durci
        run: scripts/test-fumee.sh dolop:ci

      - name: Connexion à ghcr.io
        if: env.PUBLIER == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        if: env.PUBLIER == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publier (avec SBOM et provenance)
        if: env.PUBLIER == 'true'
        id: publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIER == 'true'
      - name: Signer l'image (Sigstore, sans clé)
        if: env.PUBLIER == 'true'
        env:
          EMPREINTE: ${{ steps.publication.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${EMPREINTE}"
      - name: Attester la provenance
        if: env.PUBLIER == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
      - name: Résumé
        if: env.PUBLIER == 'true'
        env:
          EMPREINTE: ${{ steps.publication.outputs.digest }}
          ETIQUETTES: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image publiée"
            echo '```'
            echo "$ETIQUETTES"
            echo "${IMAGE}@${EMPREINTE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Publier la version
    needs: [image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # créer la page de version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notes tirées du CHANGELOG
        env:
          ETIQUETTE: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${ETIQUETTE#v}"
          awk -v v="$version" '
            /^## \[/ { dedans = index($0, "[" v "]") > 0; next }
            dedans { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md n'a pas de section [$version]"; exit 1; }
          gh release create "$ETIQUETTE" --verify-tag --title "$ETIQUETTE" --notes-file notes.md
