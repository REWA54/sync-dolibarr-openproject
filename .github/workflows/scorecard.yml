# OpenSSF Scorecard : note publique des bonnes pratiques de sécurité du dépôt
# (épinglage, droits des jetons, revue, signatures…). Résultats dans l'onglet Security.
name: Scorecard

on:
  push:
    branches: [master, main]
  branch_protection_rule:
  schedule:
    - cron: "23 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read # lire le dépôt
      security-events: write # publier les résultats dans l'onglet Security
      id-token: write # publication des résultats et du badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
