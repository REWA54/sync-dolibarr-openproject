[project]
name = "dolop"
version = "0.2.0"
description = "Synchronisation Dolibarr ↔ OpenProject : projets, utilisateurs, membres, tâches, temps et commentaires"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["dolibarr", "openproject", "synchronisation", "timesheet", "erp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "httpx>=0.27,<1",
    "markdown>=3.6,<4",
    "markdownify>=0.13,<2",
    "nh3>=0.2.17,<1",
]

[project.urls]
Source = "https://github.com/REWA54/sync-dolibarr-openproject"
Issues = "https://github.com/REWA54/sync-dolibarr-openproject/issues"
Changelog = "https://github.com/REWA54/sync-dolibarr-openproject/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-Markdown",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
dolop = "dolop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dolop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["dolop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Cliquet : la CI échoue si la couverture recule. À relever quand elle monte.
fail_under = 74
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert sert au typage (mypy), jamais à un contrôle de sécurité

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# S : règles de sécurité (celles de bandit) ; T20 : pas de print() oublié hors de la ligne de commande.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PIE", "T20"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographie française (espaces insécables, guillemets)
    "S101",  # assert sert au typage (mypy), jamais à un contrôle de sécurité
]

[tool.ruff.lint.per-file-ignores]
"src/dolop/__main__.py" = ["T201"]  # la ligne de commande écrit sur la sortie standard
"tests/**" = ["S105", "S106"]  # faux jetons dans les tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dolop"]
