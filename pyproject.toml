[project]
name = "dolop"
version = "0.1.0"
description = "Synchronisation Dolibarr ↔ OpenProject : projets, utilisateurs, membres, tâches, temps et commentaires"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "markdown>=3.6,<4",
    "markdownify>=0.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-Markdown"]

[project.scripts]
dolop = "dolop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dolop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographie française (espaces insécables, guillemets)

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dolop"]
